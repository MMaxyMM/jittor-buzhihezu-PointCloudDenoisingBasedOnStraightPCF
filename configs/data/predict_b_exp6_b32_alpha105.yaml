# 正式 B 榜预测只读取官方 noisy.npy，不进行训练侧动态加噪。
predict_dataset:
  shuffle: false
  batch_size: 1
  num_workers: 8
  datapath:
    input_dataset_dir: ./dataset_test_noisy
    use_prob: false
    loader: npy
    data_name: noisy.npy
    ignore_check: true
    data_path:
      shapenet:
        - [./datalist/test_b.txt, 1.0]
